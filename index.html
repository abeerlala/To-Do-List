<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/eedac787f9.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <div class="mainContainer">
        <div class="container">
            <h1>To-Do List</h1>
            <form class="form">
                <input id="taskInput" type="text" placeholder="Add New Task" autocomplete="off">
                <button id="taskSubmit">Add Task</button>
            </form>
            <p class="warn">New Task Cannot Be Empty *</p>
            <div class="taskList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
